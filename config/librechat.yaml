cache: true

interface:
  customWelcome: 'Welcome to HelpWise — Cobalt Dynamics IT Helpdesk. Ask about password resets, VPN access, hardware requests, or onboarding steps.'
  landingFooter: true

endpoints:
  google:
    # Free-tier Gemini models only — keep usage inside the free quota.
    titleModel: "gemini-2.0-flash-lite-001"

